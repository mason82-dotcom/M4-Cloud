name: m4-cloud

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${M4_HTTP_BIND:-0.0.0.0}:${M4_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [m4]

  control-api:
    build:
      context: ./services/control-api
    restart: unless-stopped
    environment: &control-environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-m4cloud}"
      POSTGRES_USER: "${POSTGRES_USER:-m4cloud}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      MQTT_HOST: "${MQTT_HOST:-mqtt}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_WORKER_USERNAME: "${MQTT_WORKER_USERNAME:-m4-worker}"
      MQTT_WORKER_PASSWORD: "${MQTT_WORKER_PASSWORD:?set MQTT_WORKER_PASSWORD in .env}"
      DJI_MQTT_TOPICS: "${DJI_MQTT_TOPICS:-m4/fh2/#}"
      DJI_CLOUD_API_ENABLED: "${DJI_CLOUD_API_ENABLED:-false}"
      DJI_CLOUD_API_TOPICS: "${DJI_CLOUD_API_TOPICS:-thing/product/+/osd,thing/product/+/state,thing/product/+/services_reply,thing/product/+/events,thing/product/+/requests,thing/product/+/property/set_reply,sys/product/+/status}"
      DJI_BOOTSTRAP_TOKEN: "${DJI_BOOTSTRAP_TOKEN:-}"
      DJI_PLATFORM_NAME: "${DJI_PLATFORM_NAME:-M4 Cloud}"
      DJI_WORKSPACE_ID: "${DJI_WORKSPACE_ID:-}"
      DJI_WORKSPACE_NAME: "${DJI_WORKSPACE_NAME:-M4 Workspace}"
      DJI_WORKSPACE_DESCRIPTION: "${DJI_WORKSPACE_DESCRIPTION:-M4 DJI Cloud}"
      DJI_APP_ID: "${DJI_APP_ID:-}"
      DJI_APP_KEY: "${DJI_APP_KEY:-}"
      DJI_APP_LICENSE: "${DJI_APP_LICENSE:-}"
      DJI_API_HOST: "${DJI_API_HOST:-}"
      DJI_API_TOKEN: "${DJI_API_TOKEN:-}"
      DJI_WS_HOST: "${DJI_WS_HOST:-}"
      DJI_WS_TOKEN: "${DJI_WS_TOKEN:-}"
      DJI_MQTT_EXTERNAL_HOST: "${DJI_MQTT_EXTERNAL_HOST:-}"
      DJI_MQTT_USERNAME: "${DJI_MQTT_USERNAME:-dji-pilot}"
      DJI_MQTT_PASSWORD: "${DJI_MQTT_PASSWORD:-}"
      FH2_UPSTREAM_BASE_URL: "${FH2_UPSTREAM_BASE_URL:-}"
      FH2_USER_TOKEN: "${FH2_USER_TOKEN:-${FH2_API_TOKEN:-}}"
      FH2_ORG_UUID: "${FH2_ORG_UUID:-}"
      FH2_PROJECT_UUID: "${FH2_PROJECT_UUID:-}"
      FH2_LANGUAGE: "${FH2_LANGUAGE:-zh}"
      FH2_UPSTREAM_VERIFY_TLS: "${FH2_UPSTREAM_VERIFY_TLS:-true}"
      FH2_TIMEOUT_SECONDS: "${FH2_TIMEOUT_SECONDS:-15}"
      DJI_CLOUD_API_BASE_URL: "${DJI_CLOUD_API_BASE_URL:-}"
      DJI_CLOUD_API_TOKEN: "${DJI_CLOUD_API_TOKEN:-}"
      DJI_CLOUD_API_VERIFY_TLS: "${DJI_CLOUD_API_VERIFY_TLS:-true}"
      DJI_CLOUD_API_TIMEOUT_SECONDS: "${DJI_CLOUD_API_TIMEOUT_SECONDS:-15}"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [m4]

  integration-worker:
    build:
      context: ./services/control-api
    restart: unless-stopped
    command: ["python", "-m", "app.mqtt_worker"]
    environment: *control-environment
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks: [m4]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-m4cloud}"
      POSTGRES_USER: "${POSTGRES_USER:-m4cloud}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}\" psql -h 127.0.0.1 -U \"${POSTGRES_USER:-m4cloud}\" -d \"${POSTGRES_DB:-m4cloud}\" -tAc 'SELECT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [m4]

  mqtt:
    build:
      context: ./infra/mosquitto
    image: m4-mqtt:current
    restart: unless-stopped
    environment:
      MQTT_WORKER_USERNAME: "${MQTT_WORKER_USERNAME:-m4-worker}"
      MQTT_WORKER_PASSWORD: "${MQTT_WORKER_PASSWORD:?set MQTT_WORKER_PASSWORD in .env}"
      MQTT_HEALTH_USERNAME: "${MQTT_HEALTH_USERNAME:-m4-health}"
      MQTT_HEALTH_PASSWORD: "${MQTT_HEALTH_PASSWORD:?set MQTT_HEALTH_PASSWORD in .env}"
      DJI_CLOUD_API_ENABLED: "${DJI_CLOUD_API_ENABLED:-false}"
      DJI_MQTT_USERNAME: "${DJI_MQTT_USERNAME:-dji-pilot}"
      DJI_MQTT_PASSWORD: "${DJI_MQTT_PASSWORD:-}"
    ports:
      - "${M4_MQTT_BIND:-127.0.0.1}:${M4_MQTT_PORT:-1883}:1883"
    volumes:
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u \"$MQTT_HEALTH_USERNAME\" -P \"$MQTT_HEALTH_PASSWORD\" -t m4/health -m ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [m4]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      control-api:
        condition: service_healthy
    networks: [m4]

networks:
  m4:
    driver: bridge

volumes:
  postgres-data:
  mqtt-data:
  prometheus-data:
