name: m4-cloud

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${M4_HTTP_BIND:-0.0.0.0}:${M4_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-api:
        condition: service_healthy
    networks: [m4]

  control-api:
    build:
      context: ./services/control-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-m4cloud}"
      POSTGRES_USER: "${POSTGRES_USER:-m4cloud}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      MQTT_HOST: "${MQTT_HOST:-mqtt}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      FH2_UPSTREAM_BASE_URL: "${FH2_UPSTREAM_BASE_URL:-}"
      FH2_UPSTREAM_VERIFY_TLS: "${FH2_UPSTREAM_VERIFY_TLS:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [m4]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-m4cloud}"
      POSTGRES_USER: "${POSTGRES_USER:-m4cloud}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m4cloud} -d ${POSTGRES_DB:-m4cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [m4]

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${M4_MQTT_BIND:-127.0.0.1}:${M4_MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    networks: [m4]

networks:
  m4:
    driver: bridge

volumes:
  postgres-data:
  mqtt-data:
