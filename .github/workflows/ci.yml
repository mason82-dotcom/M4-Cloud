name: ci

on:
  push:
    branches:
      - agent/fh2-onprem-control
      - agent/fullstack-integration
      - main
  pull_request:
    branches:
      - agent/fullstack-integration
      - main

permissions:
  contents: read

jobs:
  control-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and boot stack
        env:
          POSTGRES_PASSWORD: ci-password-not-a-secret
        run: |
          docker compose config --quiet
          docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Exercise API
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/api/v1/system/status
          curl --fail --silent http://127.0.0.1:8080/api/v1/fh2/status
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
