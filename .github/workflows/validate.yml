name: Director Validation

on:
  workflow_dispatch:

# CI is owned and started manually by the Director.
# Manager, RC Pro and Multispektral do not trigger CI.

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POSTGRES_PASSWORD: ci-test-password
      M4_HTTP_BIND: 127.0.0.1
      M4_HTTP_PORT: 8080
      M4_MQTT_BIND: 127.0.0.1
      M4_MQTT_PORT: 1883
      PROMETHEUS_PORT: 9090

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-api/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r services/control-api/requirements-dev.txt

      - name: Run API and worker tests
        working-directory: services/control-api
        run: PYTHONPATH=. pytest -q

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build stack
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for complete M4 readiness
        shell: bash
        run: |
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify health and status APIs
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ready
          curl --fail --silent http://127.0.0.1:8080/api/v1/system/status
          curl --fail --silent http://127.0.0.1:8080/api/v1/fh2/status

      - name: Verify HTTP event persistence
        shell: bash
        run: |
          curl --fail --silent             -H 'Content-Type: application/json'             -d '{"source":"ci","topic":"http/test","payload":{"http":true}}'             http://127.0.0.1:8080/api/v1/events
          curl --fail --silent http://127.0.0.1:8080/api/v1/events?limit=20 | grep -q '"http":true'

      - name: Verify MQTT worker persistence
        shell: bash
        run: |
          docker compose exec -T mqtt             mosquitto_pub -h 127.0.0.1 -p 1883             -t m4/fh2/ci -m '{"ci":true}'
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/events?limit=20 | grep -q '"ci":true'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color integration-worker mqtt
          exit 1

      - name: Verify monitoring profile
        shell: bash
        run: |
          docker compose --profile monitoring up -d prometheus
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose --profile monitoring logs --no-color prometheus
          exit 1

      - name: Show service state
        run: docker compose --profile monitoring ps

      - name: Stop stack
        if: always()
        run: docker compose --profile monitoring down -v --remove-orphans
