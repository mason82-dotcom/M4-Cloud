name: V1 Validation

on:
  push:
    branches:
      - main
      - agent/fh2-onprem-control
      - agent/fullstack-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-test-password
      M4_HTTP_BIND: 127.0.0.1
      M4_HTTP_PORT: 8080
      M4_MQTT_BIND: 127.0.0.1
      M4_MQTT_PORT: 1883

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-api/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r services/control-api/requirements-dev.txt

      - name: Run API tests
        working-directory: services/control-api
        run: PYTHONPATH=. pytest -q

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build stack
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for M4 health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify readiness and status API
        run: |
          curl --fail --silent http://127.0.0.1:8080/ready
          curl --fail --silent http://127.0.0.1:8080/api/v1/system/status

      - name: Show service state
        run: docker compose ps

      - name: Stop stack
        if: always()
        run: docker compose down -v
