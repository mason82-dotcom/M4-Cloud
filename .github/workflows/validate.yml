name: Direktor - Validate

on:
  workflow_dispatch:

# Die zentrale CI wird ausschließlich vom Direktor manuell gestartet.
# Manager, RC Pro und Multispektral triggern keine CI-Läufe.

jobs:
  control-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
